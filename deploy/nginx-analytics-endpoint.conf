# Include this location in the ProfePlus HTTPS virtual host after defining the
# `profeplus_product_events` format from nginx-analytics-log-format.conf.
# The dedicated log stores only a timestamp and fixed event path.
location ~ ^/__analytics/v1/(app_open|landing_workspace_open|route_today|route_agenda|route_classroom|route_search|route_planner|route_evaluation|route_gradebook|route_attendance|route_tutor|route_reports|route_management|route_settings|onboarding_completed|class_saved|calendar_exported|search_used|backup_exported|backup_verified|backup_imported|feedback_opened|feedback_shared)$ {
    if ($request_method != POST) {
        return 405;
    }

    access_log /dev/stdout profeplus_product_events;
    add_header Cache-Control "no-store" always;
    return 204;
}
